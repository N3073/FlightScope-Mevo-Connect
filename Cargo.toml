[package]
name = "FlightScope-connect"
version = "1.0.0"
edition = "2024"
license = "AGPL-3.0-or-later"

[dependencies]
eframe = { version = "0.37", features = ["persistence"] }
raw-window-handle = "0.6"
semver = "1.0.28"
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "0.11.1"
sys-locale = "0.3.2"
tray-icon = "0.26"
ureq = { version = "3", features = ["json"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_NetworkManagement_Ndis", "Win32_NetworkManagement_WiFi", "Win32_System_Diagnostics_Debug", "Win32_UI_WindowsAndMessaging"] }
winreg = "0.56.0"

[profile.dev]
opt-level=0

[profile.release]
opt-level=3
strip=true
lto=true

[build-dependencies]
winresource = "0.1.34"
